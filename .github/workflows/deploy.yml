name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build Web App
        run: |
          # Build using the simplest command possible to avoid CLI errors
          flet build web . --yes

      - name: Fix Pathing for GitHub Pages
        run: |
          # Manually update index.html to use the /Typing-Racer/ sub-path
          sed -i 's|href="/"|href="/Typing-Racer/"|g' build/web/index.html
          sed -i 's|src="flutter|src="/Typing-Racer/flutter|g' build/web/index.html
          sed -i 's|href="flutter|href="/Typing-Racer/flutter|g' build/web/index.html

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4